services:
  backend:
    build: .
    container_name: backend
    env_file: .env
    command: flask run --host=0.0.0.0 --port=5000
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    depends_on:
      - redis
    restart: always

  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A celery_app.celery worker --loglevel=INFO --pool=solo
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
      - backend
    restart: always

  celery_beat:
    build: .
    container_name: celery_beat
    command: celery -A celery_app.celery beat --loglevel=INFO
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
      - backend
    restart: always

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    restart: always
